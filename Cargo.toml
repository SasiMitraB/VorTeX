[package]
name = "vortex"
version = "0.2.0"
edition = "2021"
description = "VorTeX - High-performance GPU-accelerated LaTeX editor built with GPUI"

[lib]
name = "vortex"
path = "src_rust/lib.rs"

[[bin]]
name = "vortex"
path = "src_rust/main.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
rfd = "0.15"
anyhow = "1.0"
open = "5.3"
dirs = "5.0"
regex = "1.10"
fuzzy-matcher = "0.3"
biblatex = "0.10"
notify = "6.1"
notify-debouncer-mini = "0.4"
walkdir = "2.5"
chrono = "0.4"
mupdf = "0.8"

[dev-dependencies]
tempfile = "3.10"

