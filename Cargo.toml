[workspace]
resolver = "2"
members = ["crates/vortex-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
